[workspace]
channels = ["conda-forge"]
name = "scimilarity"
platforms = [
  {name = "linux-64-cpu", platform = "linux-64"},
  {name = "linux-64-gpu", platform = "linux-64", cuda = "12.9"},
  {name = "linux-aarch64-cpu", platform = "linux-aarch64"},
  {name = "linux-aarch64-gpu", platform = "linux-aarch64", cuda = "12.9"},
  "osx-arm64"
]

[dependencies]
python = ">=3.14.8,<3.15"
anndata = ">=0.12.19,<0.13"
hnswlib = ">=0.8.0,<0.9"
leidenalg = ">=0.12.0,<0.13"
zarr = ">=2.6.1,<3.0.0"

[pypi-dependencies]
scimilarity = ">=0.4.1, <0.5"

# GPU feature
[feature.gpu]
platforms = ["linux-64-gpu", "linux-aarch64-gpu"]

[feature.gpu.dependencies]
pytorch-gpu = ">=2.14.1,<3"
cuda-version = ">=12.9,<13"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.14.1,<3"

[environments]
gpu = { features = ["gpu"] }
cpu = { features = ["cpu"] }
default = { features = ["cpu"]  }
